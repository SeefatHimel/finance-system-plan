          maxLength: 120
          description: Optional Android/device SMS row ID when available.
        body_hash:
          type: string
          maxLength: 64
          readOnly: true
        provider:
          type: string
          description: Provider resolved from the matching sender rule.
        message_kind:
          type: string
          description: Message kind resolved before storage when possible.
        exclusion_reason:
          type: string
          description: Why the raw body was excluded or the candidate was rejected.
        status:
          $ref: '#/components/schemas/RawMessageStatus'
        duplicate_of:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        redacted_at:
          type: string
          format: date-time
          nullable: true
    RawMessageImportRequest:
      type: object
      required: [sender, body, received_at]
      properties:
        sender:
          type: string
          maxLength: 120
        body:
          type: string
        received_at:
          type: string
          format: date-time
        device_message_id:
          type: string
          maxLength: 120
          default: ""
        reprocess_existing:
          type: boolean
          default: false
          description: Re-run a duplicate pending review candidate through the latest parser.
    RawMessageImportResponse:
      type: object
      required: [candidate, is_duplicate, was_reprocessed, message]
      properties:
        candidate:
          allOf:
            - $ref: '#/components/schemas/ParsedMessageCandidate'
          nullable: true
        is_duplicate:
          type: boolean
        was_reprocessed:
          type: boolean
          description: True when an existing pending candidate was updated by the latest parser.
        message:
          $ref: '#/components/schemas/RawMessage'
    RawMessageRedactResponse:
      type: object
      required: [candidate, message]
      properties:
        candidate:
          allOf:
            - $ref: '#/components/schemas/ParsedMessageCandidate'
          nullable: true
        message:
          $ref: '#/components/schemas/RawMessage'
    ParsedMessageCandidate:
      type: object
      required:
        [id, raw_message, sender_rule, account, payment_method, category, destination_account, destination_payment_method, transaction, possible_related_candidate, provider, message_kind, transaction_type, amount, sender_account_identifier, sender_card_identifier, receiver_account_identifier, receiver_card_identifier, counterparty_text, reference, balance_after, fee_amount, possible_internal_transfer, related_match_reason, confidence, status, parser_name, parser_notes, rejection_reason, rejection_note, rejected_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        raw_message:
          $ref: '#/components/schemas/RawMessage'
        sender_rule:
          type: string
          format: uuid
          nullable: true
        account:
          type: string
          format: uuid
          nullable: true
        payment_method:
          type: string
          format: uuid
          nullable: true
        category:
          type: string
          format: uuid
          nullable: true
        destination_account:
          type: string
          format: uuid
          nullable: true
          description: Destination account hint for transfer-aware review.
        destination_payment_method:
          type: string
          format: uuid
          nullable: true
          description: Destination payment method hint for transfer-aware review.
        transaction:
          type: string
          format: uuid
          nullable: true
        possible_related_candidate:
          type: string
          format: uuid
          nullable: true
          description: Candidate that may represent the other side of the same internal transfer.
        provider:
          $ref: '#/components/schemas/SenderRuleProvider'
        message_kind:
          $ref: '#/components/schemas/ParsedMessageKind'
        transaction_type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          type: string
          nullable: true
          pattern: '^\d+(\.\d{1,2})?$'
          example: "500.00"
        sender_account_identifier:
          type: string
          maxLength: 120
          description: Masked account evidence for the sending side; never a full account number.
        sender_card_identifier:
          type: string
          maxLength: 120
          description: Masked card evidence for the sending side; never a full PAN.
        receiver_account_identifier:
          type: string
          maxLength: 120
          description: Masked account evidence for the receiving side.
        receiver_card_identifier:
          type: string
          maxLength: 120
          description: Masked card evidence for the receiving side; never a full PAN.
        counterparty_text:
          type: string
          maxLength: 255
        reference:
          type: string
          maxLength: 120
        balance_after:
          type: string
          nullable: true
          pattern: '^-?\d+(\.\d{1,2})?$'
          example: "1500.00"
        fee_amount:
          type: string
          nullable: true
          pattern: '^\d+(\.\d{1,2})?$'
          example: "0.00"
        possible_internal_transfer:
          type: boolean
        related_match_reason:
          type: string
          maxLength: 255
        confidence:
          type: string
          example: "0.70"
        status:
          $ref: '#/components/schemas/ParsedMessageCandidateStatus'
        parser_name:
          type: string
        suggested_transfer_direction:
          type: string
          enum: ['', debit, credit]
          description: Optional suggested direction for the reporting account; blank when no transfer path is suggested.
        transfer_suggestion_reason:
          type: string
          description: Explanation for a suggested transfer path or ambiguity. Suggestions require review and never post ledger activity.
        parser_notes:
          type: string
        rejection_reason:
          type: string
          description: Empty until the candidate is rejected.
        rejection_note:
          type: string
        rejected_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ParsedMessageConfirmRequest:
      type: object
      properties:
        account_perspective:
          type: boolean
          default: false
          description: When true, account is the observed account, direction is its debit/credit side, and transfer_account is the other account. Credit transfers are normalized to other account as source. Omit or use false for legacy canonical source/destination corrections.
        account:
          type: string
          format: uuid
          description: Required if the candidate did not match an account.
        transfer_account:
          type: string
          format: uuid
          nullable: true
          description: Required when confirming a candidate as a transfer; the other account when account_perspective is true, otherwise the canonical destination.
        amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          description: Required if the baseline parser did not extract an amount.
        balance_after:
          type: string
          nullable: true
          pattern: '^-?\d+(\.\d{1,2})?$'
        category:
          type: string
          format: uuid
          nullable: true
        payment_method:
          type: string
          format: uuid
          nullable: true
        date:
          type: string
          format: date
        time:
          type: string
          format: time
          nullable: true
        direction:
          $ref: '#/components/schemas/TransactionDirection'
        reference:
          type: string
        counterparty_text:
          type: string
        sender_account_identifier:
          type: string
          maxLength: 120
        sender_card_identifier:
          type: string
          maxLength: 120
        receiver_account_identifier:
          type: string
          maxLength: 120
        receiver_card_identifier:
          type: string
          maxLength: 120
        note:
          type: string
        type:
          $ref: '#/components/schemas/TransactionType'
        remember_mapping:
          type: boolean
          default: false
          description: Learn choices for this sender and parsed message kind, then apply them to matching pending candidates.
    MessageCandidateBulkReprocessResponse:
