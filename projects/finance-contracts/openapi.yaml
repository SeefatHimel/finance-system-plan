components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UuidPathId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    UnauthorizedError:
      description: Authentication credentials were not provided or are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
    NotFoundError:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorObject'
              - type: object
                additionalProperties:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ErrorObject:
      type: object
      properties:
        detail:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string
    TokenPair:
      type: object
      required: [access, refresh]
      properties:
        access:
          type: string
        refresh:
          type: string
    User:
      type: object
      required: [id, username, email, first_name, last_name]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
    AccountType:
      type: string
      enum: [cash, home_cash, mobile_wallet, bank, credit_card, savings, other]
    CategoryKind:
      type: string
      enum: [expense, income, transfer, debt, system]
    TransactionType:
      type: string
      enum:
        - expense
        - income
        - transfer
        - adjustment
        - fee
        - refund
        - lend
        - borrow
        - repayment_received
        - repayment_paid
    TransactionSource:
      type: string
      enum: [web, mobile, sms, import, system]
    TransactionDirection:
      type: string
      enum: [debit, credit]
    AuditLogAction:
      type: string
      enum: [created, updated, deleted]
    PaymentProvider:
      type: string
      enum: [cash, bkash, nagad, rocket, ebl, city_bank, pathao_pay, bank, card, manual, other]
    SenderRuleProvider:
      type: string
      enum: [bkash, nagad, rocket, ebl, city_bank, pathao_pay, bank, card, other]
    SenderRuleMatchType:
      type: string
      enum: [exact, contains, regex]
    RawMessageStatus:
      type: string
      enum: [imported, duplicate, ignored, redacted]
    ParsedMessageCandidateStatus:
      type: string
      enum: [needs_review, confirmed, ignored]
    BalanceSnapshotStatus:
      type: string
      enum: [matched, missing_money, extra_money, adjusted, ignored]
    DebtDirection:
      type: string
      enum: [lent_by_me, borrowed_by_me]
    DebtStatus:
      type: string
      enum: [open, partially_paid, paid, written_off]
    CreditCardBillStatus:
      type: string
      enum: [unpaid, partially_paid, paid, waived]
    RecurringBillFrequency:
      type: string
      enum: [weekly, monthly, quarterly, yearly]
    RecurringBillStatus:
      type: string
      enum: [active, paused, ended]
    ParsedMessageKind:
      type: string
      enum:
        - purchase
        - cash_in
        - cash_out
        - send_money
        - receive_money
        - bank_transfer_in
        - bank_transfer_out
        - card_purchase
        - card_payment
        - fee
        - refund
        - reversal
        - balance_notice
        - otp_or_security
        - unknown
    AuditLogEntry:
      type: object
      required: [id, action, entity_type, entity_id, before, after, metadata, created_at]
      properties:
        id:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/AuditLogAction'
        entity_type:
          type: string
          example: transactions.transaction
        entity_id:
          type: string
          example: 11111111-1111-1111-1111-111111111111
        before:
          type: object
          additionalProperties: true
          nullable: true
          description: Snapshot before the change; null for creates.
        after:
          type: object
          additionalProperties: true
          nullable: true
          description: Snapshot after the change; null for deletes.
        metadata:
          type: object
          additionalProperties: true
          description: Non-sensitive audit metadata, including recorded timestamp.
        created_at:
          type: string
          format: date-time
    Account:
      type: object
      required:
        [id, name, type, currency, starting_balance, is_active, display_order, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          type: string
          maxLength: 3
          default: BDT
        starting_balance:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          example: "0.00"
        is_active:
          type: boolean
        display_order:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AccountCreateRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          maxLength: 120
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          type: string
          maxLength: 3
          default: BDT
        starting_balance:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          example: "0.00"
        is_active:
          type: boolean
          default: true
        display_order:
          type: integer
          minimum: 0
          default: 0
    AccountPatchRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          type: string
          maxLength: 3
        starting_balance:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
        is_active:
          type: boolean
        display_order:
          type: integer
          minimum: 0
    PaymentMethod:
      type: object
      required:
        [id, account, name, provider, identifier, is_active, display_order, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        account:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        provider:
          $ref: '#/components/schemas/PaymentProvider'
        identifier:
          type: string
          maxLength: 120
          description: Optional masked phone, card suffix, bank nickname, or other user-safe identifier.
        is_active:
          type: boolean
        display_order:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PaymentMethodCreateRequest:
      type: object
      required: [account, name, provider]
      properties:
        account:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        provider:
          $ref: '#/components/schemas/PaymentProvider'
        identifier:
          type: string
          maxLength: 120
          default: ""
        is_active:
          type: boolean
          default: true
        display_order:
          type: integer
          minimum: 0
          default: 0
    PaymentMethodPatchRequest:
      type: object
      properties:
        account:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        provider:
          $ref: '#/components/schemas/PaymentProvider'
        identifier:
          type: string
          maxLength: 120
        is_active:
          type: boolean
        display_order:
          type: integer
          minimum: 0
    SenderRule:
      type: object
      required:
        [id, account, payment_method, name, provider, sender, match_type, pattern, priority, is_active, notes, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        account:
          type: string
          format: uuid
        payment_method:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          maxLength: 120
        provider:
          $ref: '#/components/schemas/SenderRuleProvider'
        sender:
          type: string
          maxLength: 120
          description: Must be unique per authenticated user and match type, compared case-insensitively.
        match_type:
          $ref: '#/components/schemas/SenderRuleMatchType'
        pattern:
          type: string
          maxLength: 255
          description: Optional matching pattern, especially for contains or regex rules.
        priority:
          type: integer
          minimum: 0
        is_active:
          type: boolean
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SenderRuleCreateRequest:
      type: object
      required: [account, name, provider, sender]
      properties:
        account:
          type: string
          format: uuid
        payment_method:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          maxLength: 120
        provider:
          $ref: '#/components/schemas/SenderRuleProvider'
        sender:
          type: string
          maxLength: 120
          description: Must be unique per authenticated user and match type, compared case-insensitively.
        match_type:
          $ref: '#/components/schemas/SenderRuleMatchType'
        pattern:
          type: string
          maxLength: 255
          default: ""
        priority:
          type: integer
          minimum: 0
          default: 100
        is_active:
          type: boolean
          default: true
        notes:
          type: string
          default: ""
    SenderRulePatchRequest:
      type: object
      properties:
        account:
          type: string
          format: uuid
        payment_method:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          maxLength: 120
        provider:
          $ref: '#/components/schemas/SenderRuleProvider'
        sender:
          type: string
          maxLength: 120
        match_type:
          $ref: '#/components/schemas/SenderRuleMatchType'
        pattern:
          type: string
          maxLength: 255
        priority:
          type: integer
          minimum: 0
        is_active:
          type: boolean
        notes:
          type: string
    RawMessage:
      type: object
      required:
        [id, sender, body, received_at, device_message_id, body_hash, status, duplicate_of, created_at, redacted_at]
      properties:
        id:
          type: string
          format: uuid
        sender:
          type: string
          maxLength: 120
        body:
          type: string
        received_at:
          type: string
          format: date-time
        device_message_id:
          type: string
          maxLength: 120
          description: Optional Android/device SMS row ID when available.
        body_hash:
          type: string
          maxLength: 64
          readOnly: true
        status:
          $ref: '#/components/schemas/RawMessageStatus'
        duplicate_of:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        redacted_at:
          type: string
          format: date-time
          nullable: true
    RawMessageImportRequest:
      type: object
      required: [sender, body, received_at]
      properties:
        sender:
          type: string
          maxLength: 120
        body:
          type: string
        received_at:
          type: string
          format: date-time
        device_message_id:
          type: string
          maxLength: 120
          default: ""
        reprocess_existing:
          type: boolean
          default: false
          description: Re-run a duplicate pending review candidate through the latest parser.
    RawMessageImportResponse:
      type: object
      required: [candidate, is_duplicate, was_reprocessed, message]
      properties:
        candidate:
          allOf:
            - $ref: '#/components/schemas/ParsedMessageCandidate'
          nullable: true
        is_duplicate:
          type: boolean
        was_reprocessed:
          type: boolean
          description: True when an existing pending candidate was updated by the latest parser.
        message:
          $ref: '#/components/schemas/RawMessage'
    RawMessageRedactResponse:
      type: object
      required: [candidate, message]
      properties:
        candidate:
          allOf:
            - $ref: '#/components/schemas/ParsedMessageCandidate'
          nullable: true
        message:
          $ref: '#/components/schemas/RawMessage'
    ParsedMessageCandidate:
      type: object
      required:
        [id, raw_message, sender_rule, account, payment_method, destination_account, destination_payment_method, transaction, possible_related_candidate, provider, message_kind, transaction_type, amount, counterparty_text, reference, balance_after, fee_amount, possible_internal_transfer, related_match_reason, confidence, status, parser_name, parser_notes, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        raw_message:
          $ref: '#/components/schemas/RawMessage'
        sender_rule:
          type: string
          format: uuid
          nullable: true
        account:
          type: string
          format: uuid
          nullable: true
        payment_method:
          type: string
          format: uuid
          nullable: true
        destination_account:
          type: string
          format: uuid
          nullable: true
          description: Destination account hint for transfer-aware review.
        destination_payment_method:
          type: string
          format: uuid
          nullable: true
          description: Destination payment method hint for transfer-aware review.
        transaction:
          type: string
          format: uuid
          nullable: true
        possible_related_candidate:
          type: string
          format: uuid
          nullable: true
          description: Candidate that may represent the other side of the same internal transfer.
        provider:
          $ref: '#/components/schemas/SenderRuleProvider'
        message_kind:
          $ref: '#/components/schemas/ParsedMessageKind'
        transaction_type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          type: string
          nullable: true
          pattern: '^\d+(\.\d{1,2})?$'
          example: "500.00"
        counterparty_text:
          type: string
          maxLength: 255
        reference:
