openapi: 3.0.3
info:
  title: Personal Finance API
  version: 0.1.0
  description: |
    Initial shared API contract for finance backend, web, and mobile clients.
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Accounts
  - name: Categories
  - name: Payment Methods
  - name: Sender Rules
  - name: Messages
  - name: Transactions
  - name: Reports
  - name: Debts
  - name: Credit Cards
  - name: Recurring Bills
  - name: Reconciliation
  - name: Audit Logs
paths:
  /api/health/:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/auth/login/:
    post:
      tags: [Auth]
      summary: Obtain JWT access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          description: Too many login attempts
  /api/auth/refresh/:
    post:
      tags: [Auth]
      summary: Refresh JWT access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated access and refresh tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/auth/logout/:
    post:
      tags: [Auth]
      summary: Revoke one refresh-token session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Session refresh token revoked
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/auth/logout-all/:
    post:
      tags: [Auth]
      summary: Revoke every refresh-token session for the current user
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All session refresh tokens revoked
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/auth/me/:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/accounts/:
    get:
      tags: [Accounts]
      summary: List accounts for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Accounts]
      summary: Create an account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
      responses:
        '201':
          description: Created account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/accounts/{id}/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [Accounts]
      summary: Retrieve an account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Accounts]
      summary: Update an account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatchRequest'
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Accounts]
      summary: Delete an account
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Account deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/categories/:
    get:
      tags: [Categories]
      summary: List categories for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Categories]
      summary: Create a category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
      responses:
        '201':
          description: Created category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/categories/{id}/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [Categories]
      summary: Retrieve a category
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Categories]
      summary: Update a category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryPatchRequest'
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Categories]
      summary: Delete a category
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Category deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/payment-methods/:
    get:
      tags: [Payment Methods]
      summary: List payment methods for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment method list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethod'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Payment Methods]
      summary: Create a payment method
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodCreateRequest'
      responses:
        '201':
          description: Created payment method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/payment-methods/{id}/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [Payment Methods]
      summary: Retrieve a payment method
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment method details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Payment Methods]
      summary: Update a payment method
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodPatchRequest'
      responses:
        '200':
          description: Updated payment method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Payment Methods]
      summary: Delete a payment method
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Payment method deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/messages/sender-rules/:
    get:
      tags: [Sender Rules]
      summary: List SMS sender rules for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sender rule list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SenderRule'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Sender Rules]
      summary: Create an SMS sender rule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SenderRuleCreateRequest'
      responses:
        '201':
          description: Created sender rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderRule'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/messages/sender-rules/{id}/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [Sender Rules]
      summary: Retrieve an SMS sender rule
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sender rule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderRule'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Sender Rules]
      summary: Update an SMS sender rule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SenderRulePatchRequest'
      responses:
        '200':
          description: Updated sender rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderRule'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Sender Rules]
      summary: Delete an SMS sender rule
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sender rule deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/messages/import/:
    post:
      tags: [Messages]
      summary: Import a raw SMS message and detect duplicates
      description: >-
        Only messages matching an active sender rule owned by the authenticated
        user are accepted. Messages containing no digits are automatically
        discarded as non-transactional: the response has no candidate and the
        API stores only an ignored deduplication tombstone without the SMS body.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RawMessageImportRequest'
      responses:
        '201':
          description: Message imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawMessageImportResponse'
        '200':
          description: Duplicate message detected; existing message returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawMessageImportResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/messages/capture-preferences/:
    get:
      tags: [Messages]
      summary: Get effective SMS provider and message-type exclusions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: SMS capture preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsCapturePreference'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      tags: [Messages]
      summary: Update SMS provider and message-type exclusions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsCapturePreferencePatchRequest'
      responses:
        '200':
          description: Updated SMS capture preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsCapturePreference'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/messages/device-status/:
    get:
      tags: [Messages]
      summary: Get the latest mobile SMS sync health
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Latest device heartbeat, or a not-connected status before first use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsDeviceStatus'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Messages]
      summary: Record a mobile SMS sync heartbeat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsDeviceStatusUpdateRequest'
      responses:
        '200':
          description: Updated device health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsDeviceStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/messages/raw/{id}/redact/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [Messages]
      summary: Redact raw SMS body while preserving parsed ledger evidence
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Raw message redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawMessageRedactResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/messages/review/:
    get:
      tags: [Messages]
      summary: List parsed SMS candidates waiting for review
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Review candidate list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParsedMessageCandidate'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/messages/review/reprocess/:
    post:
      tags: [Messages]
      summary: Re-run current parser and learned mappings for every pending SMS candidate
      description: Confirmed ledger transactions are not changed or duplicated.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bulk reprocessing summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageCandidateBulkReprocessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/messages/review/{id}/reprocess/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [Messages]
      summary: Re-run current parser logic for a pending SMS candidate
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Candidate refreshed with current parser output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParsedMessageCandidate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/messages/review/{id}/confirm/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [Messages]
      summary: Confirm a parsed SMS candidate as a transaction
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParsedMessageConfirmRequest'
      responses:
        '200':
          description: Confirmed candidate with linked transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParsedMessageCandidate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/messages/review/{id}/ignore/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [Messages]
      summary: Ignore a parsed SMS candidate
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ignored candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParsedMessageCandidate'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/messages/review/{id}/reject/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [Messages]
      summary: Reject a pending SMS candidate and optionally exclude its sender or provider
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParsedMessageRejectRequest'
      responses:
        '200':
          description: Rejected candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParsedMessageCandidate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/debts/:
    get:
      tags: [Debts]
      summary: List debt records
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/DebtStatus'
        - in: query
          name: direction
          schema:
            $ref: '#/components/schemas/DebtDirection'
      responses:
        '200':
          description: Debt list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Debt'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Debts]
      summary: Create a debt record
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebtCreateRequest'
      responses:
        '201':
          description: Debt created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Debt'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/debts/{id}/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [Debts]
      summary: Get a debt record
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Debt detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Debt'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Debts]
      summary: Update a debt record
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebtPatchRequest'
      responses:
        '200':
          description: Updated debt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Debt'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Debts]
      summary: Delete a debt record
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Debt deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/debts/{id}/payments/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [Debts]
      summary: Record a debt repayment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebtPaymentCreateRequest'
      responses:
        '201':
          description: Debt payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtPayment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/credit-card-bills/:
    get:
      tags: [Credit Cards]
      summary: List credit card bills
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/CreditCardBillStatus'
      responses:
        '200':
          description: Credit card bill list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreditCardBill'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Credit Cards]
      summary: Create a credit card bill
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditCardBillCreateRequest'
      responses:
        '201':
          description: Credit card bill created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCardBill'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/credit-card-bills/{id}/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [Credit Cards]
      summary: Get a credit card bill
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Credit card bill detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCardBill'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Credit Cards]
      summary: Update a credit card bill
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditCardBillPatchRequest'
      responses:
        '200':
          description: Updated credit card bill
          content:
            application/json:
