openapi: 3.0.3
info:
  title: Personal Finance API
  version: 0.1.0
  description: |
    Initial shared API contract for finance backend, web, and mobile clients.
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Accounts
  - name: Categories
  - name: Payment Methods
  - name: Sender Rules
  - name: Messages
  - name: Transactions
  - name: Reports
  - name: Debts
  - name: Credit Cards
  - name: Recurring Bills
  - name: Reconciliation
  - name: Audit Logs
  - name: Statements
paths:
  /api/statements/imports/:
    get:
      operationId: statements_imports_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
          minimum: 0
          default: 0
      tags:
      - Statements
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStatementImportList'
          description: Successful response
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      description: 'Authenticated and user-scoped. Response uses Cache-Control: no-store.'
    post:
      operationId: statements_imports_create
      tags:
      - Statements
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StatementPreviewRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementImport'
          description: Successful response
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: Readable field validation or unsafe match/decision error.
        '200':
          description: Same exact file for this account; existing draft and decisions returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementImport'
        '422':
          description: Extraction worker timeout.
        '429':
          description: 'Upload rate exceeded: 10/hour/user.'
        '503':
          description: Extraction worker unavailable.
      description: 'Authenticated and user-scoped. Response uses Cache-Control: no-store. Saves masked source
        rows only; never posts on upload. Original PDF and password are discarded. Limits match the preview
        endpoint.'
  /api/statements/imports/{id}/:
    get:
      operationId: statements_imports_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this statement import.
        required: true
      tags:
      - Statements
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementImport'
          description: Successful response
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Owned import, row, or transaction not found.
      description: 'Authenticated and user-scoped. Response uses Cache-Control: no-store.'
  /api/statements/imports/{id}/approve_new/:
    post:
      operationId: statements_imports_approve_new_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this statement import.
        required: true
      tags:
      - Statements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatementBulk'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementBulkResult'
          description: Successful response
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Owned import, row, or transaction not found.
        '400':
          description: Readable field validation or unsafe match/decision error.
      description: 'Authenticated and user-scoped. Response uses Cache-Control: no-store. Explicit bulk
        approval of up to 50 row IDs/versions. Fresh matches, source discrepancies and stale rows remain
        unresolved. Unexpected failure rolls back the entire request.'
  /api/statements/imports/{id}/rows/:
    get:
      operationId: statements_imports_rows_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this statement import.
        required: true
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: state
        required: false
        schema:
          type: string
          enum:
          - pending
          - new
          - possible_match
          - needs_correction
          - posted
          - linked
          - skipped
      - in: query
        name: direction
        required: false
        schema:
          $ref: '#/components/schemas/TransactionDirection'
      - in: query
        name: type
        required: false
        schema:
          $ref: '#/components/schemas/TransactionType'
      - in: query
        name: category
        required: false
        schema:
          type: string
          description: Owned category UUID, or none for uncategorized.
      - in: query
        name: search
        required: false
        schema:
          type: string
      - in: query
        name: date_from
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        required: false
        schema:
          type: string
          format: date
      tags:
      - Statements
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementRowPage'
          description: Successful response
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Owned import, row, or transaction not found.
        '400':
          description: Invalid filters or pagination.
      description: 'Authenticated and user-scoped. Response uses Cache-Control: no-store.'
  /api/statements/rows/{id}/:
    get:
      operationId: statements_rows_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this statement row.
        required: true
      tags:
      - Statements
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedStatementRow'
          description: Successful response
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Owned import, row, or transaction not found.
      description: 'Authenticated and user-scoped. Response uses Cache-Control: no-store.'
    patch:
      operationId: statements_rows_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this statement row.
        required: true
      tags:
      - Statements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStatementRowEdit'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedStatementRow'
          description: Successful response
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Owned import, row, or transaction not found.
        '400':
          description: Readable field validation or unsafe match/decision error.
        '409':
          description: Stale version or already resolved differently. Reload before retrying.
      description: 'Authenticated and user-scoped. Response uses Cache-Control: no-store.'
  /api/statements/rows/{id}/decide/:
    post:
      operationId: statements_rows_decide_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this statement row.
        required: true
      tags:
      - Statements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatementDecision'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedStatementRow'
          description: Successful response
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Owned import, row, or transaction not found.
        '400':
          description: Readable field validation or unsafe match/decision error.
        '409':
          description: Stale version or already resolved differently. Reload before retrying.
      description: 'Authenticated and user-scoped. Response uses Cache-Control: no-store. Link attaches
        evidence without changing existing ledger details. Create requires allow_separate when suggestions
        exist; unlink keeps the ledger entry. Resolved identical retries are idempotent.'
  /api/transactions/{id}/statement-evidence/:
    get:
      operationId: transactions_statement_evidence_list
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Transactions
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedStatementRow'
          description: Successful response
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Owned import, row, or transaction not found.
      description: 'Authenticated and user-scoped. Response uses Cache-Control: no-store.'
  /api/statements/preview/:
    post:
      tags: [Statements]
      summary: Preview statement PDF
      description: |
        Read-only extraction of BDT EBL bank, City Bank savings, or bKash digital
        statements. No ledger writes or persisted import batch. Maximum 4 MiB,
        30 pages, 2000 rows, and 20 seconds of worker processing. Passwords are
        transient. Response is private and no-store. Limited to 10 requests/hour
        per authenticated user. Scans and credit-card layouts are unsupported.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StatementPreviewRequest'
      responses:
        '200':
          description: Extracted rows, masked evidence, and validation checks; can_post is false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementPreview'
        '400':
          description: Invalid file/account, unsupported layout, size/page/row limit, or missing/incorrect password.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          description: PDF worker exceeded its processing time limit.
        '429':
          description: Preview request rate exceeded.
        '503':
          description: Statement worker is unavailable.
  /api/health/:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/auth/login/:
    post:
      tags: [Auth]
      summary: Obtain JWT access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          description: Too many login attempts
  /api/auth/refresh/:
    post:
      tags: [Auth]
      summary: Refresh JWT access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated access and refresh tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/auth/logout/:
    post:
      tags: [Auth]
      summary: Revoke one refresh-token session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Session refresh token revoked
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/auth/logout-all/:
    post:
      tags: [Auth]
      summary: Revoke every refresh-token session for the current user
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All session refresh tokens revoked
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/auth/me/:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/accounts/:
    get:
      tags: [Accounts]
      summary: List accounts for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Accounts]
      summary: Create an account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
      responses:
        '201':
          description: Created account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/accounts/{id}/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [Accounts]
      summary: Retrieve an account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Accounts]
      summary: Update an account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatchRequest'
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Accounts]
      summary: Delete an account
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Account deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/categories/:
    get:
      tags: [Categories]
      summary: List categories for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Categories]
      summary: Create a category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
      responses:
        '201':
          description: Created category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/categories/{id}/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [Categories]
      summary: Retrieve a category
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Categories]
      summary: Update a category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryPatchRequest'
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Categories]
      summary: Delete a category
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Category deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/payment-methods/:
    get:
      tags: [Payment Methods]
      summary: List payment methods for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment method list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethod'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Payment Methods]
      summary: Create a payment method
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodCreateRequest'
      responses:
        '201':
          description: Created payment method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/payment-methods/{id}/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [Payment Methods]
      summary: Retrieve a payment method
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment method details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Payment Methods]
      summary: Update a payment method
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodPatchRequest'
      responses:
        '200':
          description: Updated payment method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Payment Methods]
      summary: Delete a payment method
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Payment method deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/messages/sender-rules/:
    get:
      tags: [Sender Rules]
      summary: List SMS sender rules for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sender rule list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SenderRule'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Sender Rules]
      summary: Create an SMS sender rule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SenderRuleCreateRequest'
      responses:
        '201':
          description: Created sender rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderRule'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/messages/sender-rules/{id}/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [Sender Rules]
      summary: Retrieve an SMS sender rule
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sender rule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderRule'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Sender Rules]
      summary: Update an SMS sender rule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SenderRulePatchRequest'
      responses:
        '200':
          description: Updated sender rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderRule'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Sender Rules]
      summary: Delete an SMS sender rule
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sender rule deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/messages/import/:
    post:
      tags: [Messages]
      summary: Import a raw SMS message and detect duplicates
      description: >-
        Only messages matching an active sender rule owned by the authenticated
        user are accepted. Messages containing no digits are automatically
        discarded as non-transactional: the response has no candidate and the
        API stores only an ignored deduplication tombstone without the SMS body.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RawMessageImportRequest'
      responses:
        '201':
          description: Message imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawMessageImportResponse'
        '200':
          description: Duplicate message detected; existing message returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawMessageImportResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/messages/capture-preferences/:
    get:
      tags: [Messages]
      summary: Get effective SMS provider and message-type exclusions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: SMS capture preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsCapturePreference'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      tags: [Messages]
      summary: Update SMS provider and message-type exclusions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsCapturePreferencePatchRequest'
      responses:
        '200':
          description: Updated SMS capture preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsCapturePreference'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/messages/device-status/:
    get:
      tags: [Messages]
