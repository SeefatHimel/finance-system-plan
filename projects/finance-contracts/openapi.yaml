openapi: 3.0.3
info:
  title: Personal Finance API
  version: 0.1.0
  description: |
    Initial shared API contract for finance backend, web, and mobile clients.
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Accounts
  - name: Categories
  - name: Payment Methods
  - name: Sender Rules
  - name: Messages
  - name: Transactions
  - name: Reports
paths:
  /api/health/:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/auth/login/:
    post:
      tags: [Auth]
      summary: Obtain JWT access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/auth/refresh/:
    post:
      tags: [Auth]
      summary: Refresh JWT access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refreshed access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/auth/me/:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/accounts/:
    get:
      tags: [Accounts]
      summary: List accounts for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Accounts]
      summary: Create an account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
      responses:
        '201':
          description: Created account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/accounts/{id}/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [Accounts]
      summary: Retrieve an account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Accounts]
      summary: Update an account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatchRequest'
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Accounts]
      summary: Delete an account
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Account deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/categories/:
    get:
      tags: [Categories]
      summary: List categories for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Categories]
      summary: Create a category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
      responses:
        '201':
          description: Created category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/categories/{id}/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [Categories]
      summary: Retrieve a category
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Categories]
      summary: Update a category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryPatchRequest'
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Categories]
      summary: Delete a category
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Category deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/payment-methods/:
    get:
      tags: [Payment Methods]
      summary: List payment methods for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment method list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethod'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Payment Methods]
      summary: Create a payment method
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodCreateRequest'
      responses:
        '201':
          description: Created payment method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/payment-methods/{id}/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [Payment Methods]
      summary: Retrieve a payment method
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment method details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Payment Methods]
      summary: Update a payment method
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodPatchRequest'
      responses:
        '200':
          description: Updated payment method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Payment Methods]
      summary: Delete a payment method
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Payment method deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/messages/sender-rules/:
    get:
      tags: [Sender Rules]
      summary: List SMS sender rules for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sender rule list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SenderRule'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Sender Rules]
      summary: Create an SMS sender rule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SenderRuleCreateRequest'
      responses:
        '201':
          description: Created sender rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderRule'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/messages/sender-rules/{id}/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [Sender Rules]
      summary: Retrieve an SMS sender rule
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sender rule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderRule'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Sender Rules]
      summary: Update an SMS sender rule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SenderRulePatchRequest'
      responses:
        '200':
          description: Updated sender rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderRule'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Sender Rules]
      summary: Delete an SMS sender rule
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sender rule deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/messages/import/:
    post:
      tags: [Messages]
      summary: Import a raw SMS message and detect duplicates
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RawMessageImportRequest'
      responses:
        '201':
          description: Message imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawMessageImportResponse'
        '200':
          description: Duplicate message detected; existing message returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawMessageImportResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/messages/review/:
    get:
      tags: [Messages]
      summary: List parsed SMS candidates waiting for review
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Review candidate list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParsedMessageCandidate'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/messages/review/{id}/confirm/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [Messages]
      summary: Confirm a parsed SMS candidate as a transaction
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParsedMessageConfirmRequest'
      responses:
        '200':
          description: Confirmed candidate with linked transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParsedMessageCandidate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/messages/review/{id}/ignore/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [Messages]
      summary: Ignore a parsed SMS candidate
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ignored candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParsedMessageCandidate'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/reconciliation/snapshots/:
    get:
      tags: [Reconciliation]
      summary: List balance snapshots
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: account
          schema:
            type: string
            format: uuid
          description: Optional account filter.
      responses:
        '200':
          description: Balance snapshot list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BalanceSnapshot'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Reconciliation]
      summary: Create a balance snapshot
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceSnapshotCreateRequest'
      responses:
        '201':
          description: Balance snapshot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSnapshot'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/reconciliation/snapshots/{id}/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [Reconciliation]
      summary: Get a balance snapshot
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Balance snapshot detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSnapshot'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Reconciliation]
      summary: Update a balance snapshot note
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceSnapshotPatchRequest'
      responses:
        '200':
          description: Updated balance snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSnapshot'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Reconciliation]
      summary: Delete a balance snapshot
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Balance snapshot deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/reconciliation/accounts/{id}/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [Reconciliation]
      summary: Get expected balance and latest snapshot for an account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account reconciliation summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountReconciliation'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/transactions/:
    get:
      tags: [Transactions]
      summary: List transactions for current user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: month
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          description: Filter by month in YYYY-MM format.
        - in: query
          name: account
          schema:
            type: string
            format: uuid
        - in: query
          name: category
          schema:
            type: string
            format: uuid
        - in: query
          name: type
          schema:
            $ref: '#/components/schemas/TransactionType'
      responses:
        '200':
          description: Transaction list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Transactions]
      summary: Create a transaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreateRequest'
      responses:
        '201':
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/transactions/{id}/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [Transactions]
      summary: Retrieve a transaction
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Transaction details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Transactions]
      summary: Update a transaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionPatchRequest'
      responses:
        '200':
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Transactions]
      summary: Delete a transaction
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Transaction deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/reports/monthly/:
    get:
      tags: [Reports]
      summary: Get monthly totals by category and account movement
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: month
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          description: Month in YYYY-MM format. Defaults to current month.
      responses:
        '200':
          description: Monthly report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyReport'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UuidPathId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    UnauthorizedError:
      description: Authentication credentials were not provided or are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
    NotFoundError:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorObject'
              - type: object
                additionalProperties:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ErrorObject:
      type: object
      properties:
        detail:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string
    TokenPair:
      type: object
      required: [access, refresh]
      properties:
        access:
          type: string
        refresh:
          type: string
    AccessToken:
      type: object
      required: [access]
      properties:
        access:
          type: string
    User:
      type: object
      required: [id, username, email, first_name, last_name]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
    AccountType:
      type: string
      enum: [cash, home_cash, mobile_wallet, bank, credit_card, savings, other]
    CategoryKind:
      type: string
      enum: [expense, income, transfer, debt, system]
    TransactionType:
      type: string
      enum:
        - expense
        - income
        - transfer
        - adjustment
        - fee
        - refund
        - lend
        - borrow
        - repayment_received
        - repayment_paid
    TransactionSource:
      type: string
      enum: [web, mobile, sms, import, system]
    PaymentProvider:
      type: string
      enum: [cash, bkash, nagad, rocket, ebl, city_bank, pathao_pay, bank, card, manual, other]
    SenderRuleProvider:
      type: string
      enum: [bkash, nagad, rocket, ebl, city_bank, pathao_pay, bank, card, other]
    SenderRuleMatchType:
      type: string
      enum: [exact, contains, regex]
    RawMessageStatus:
      type: string
      enum: [imported, duplicate, ignored]
    ParsedMessageCandidateStatus:
      type: string
      enum: [needs_review, confirmed, ignored]
    BalanceSnapshotStatus:
      type: string
      enum: [matched, missing_money, extra_money, adjusted, ignored]
    ParsedMessageKind:
      type: string
      enum:
        - purchase
        - cash_in
        - cash_out
        - send_money
        - receive_money
        - bank_transfer_in
        - bank_transfer_out
        - card_purchase
        - card_payment
        - fee
        - refund
        - reversal
        - balance_notice
        - otp_or_security
        - unknown
    Account:
      type: object
      required:
        [id, name, type, currency, starting_balance, is_active, display_order, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          type: string
          maxLength: 3
          default: BDT
        starting_balance:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          example: "0.00"
        is_active:
          type: boolean
        display_order:
          type: integer
          minimum: 0
        created_at:
