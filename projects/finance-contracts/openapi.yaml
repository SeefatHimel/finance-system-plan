      tags: [Transactions]
      summary: Create a transaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreateRequest'
      responses:
        '201':
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/transactions/{id}/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [Transactions]
      summary: Retrieve a transaction
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Transaction details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Transactions]
      summary: Update a transaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionPatchRequest'
      responses:
        '200':
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Transactions]
      summary: Delete a transaction
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Transaction deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/transactions/{id}/source-messages/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [Transactions]
      summary: List original SMS linked to a transaction
      description: Load only on demand for the current user's transaction. Includes its original SMS and linked transfer messages, deduplicated and ordered by received time then ID. Returns an empty array when no SMS is linked. Redacted or excluded bodies are null; reads do not change ledger timestamps. Responses use Cache-Control private, no-store.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Linked source messages without device identifiers or body hashes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionSourceMessage'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/audit-logs/:
    get:
      tags: [Audit Logs]
      summary: List audit log entries for current user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: action
          schema:
            $ref: '#/components/schemas/AuditLogAction'
        - in: query
          name: entity_type
          schema:
            type: string
          description: Django model label such as `transactions.transaction`.
        - in: query
          name: entity_id
          schema:
            type: string
          description: UUID or primary key of the audited entity.
      responses:
        '200':
          description: Audit log entry list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogEntry'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/audit-logs/{id}/:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [Audit Logs]
      summary: Retrieve an audit log entry
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Audit log entry details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogEntry'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/reports/monthly/:
    get:
      tags: [Reports]
      summary: Get monthly totals by category and account movement
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: month
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          description: Month in YYYY-MM format. Defaults to current month.
      responses:
        '200':
          description: Monthly report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyReport'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UuidPathId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    UnauthorizedError:
      description: Authentication credentials were not provided or are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
    NotFoundError:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorObject'
              - type: object
                additionalProperties:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ErrorObject:
      type: object
      properties:
        detail:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string
    TokenPair:
      type: object
      required: [access, refresh]
      properties:
        access:
          type: string
        refresh:
          type: string
    User:
      type: object
      required: [id, username, email, first_name, last_name]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
    AccountType:
      type: string
      enum: [cash, home_cash, mobile_wallet, bank, credit_card, savings, other]
    CategoryKind:
      type: string
      enum: [expense, income, transfer, debt, system]
    TransactionType:
      type: string
      enum:
        - expense
        - income
        - transfer
        - adjustment
        - fee
        - refund
        - lend
        - borrow
        - repayment_received
        - repayment_paid
    TransactionSource:
      type: string
      enum: [web, mobile, sms, import, system]
    TransactionDirection:
      type: string
      enum: [debit, credit]
    AuditLogAction:
      type: string
      enum: [created, updated, deleted]
    PaymentProvider:
      type: string
      enum: [cash, bkash, nagad, rocket, ebl, city_bank, pathao_pay, bank, card, manual, other]
    SenderRuleProvider:
      type: string
      enum: [bkash, nagad, rocket, ebl, city_bank, pathao_pay, bank, card, other]
    SenderRuleMatchType:
      type: string
      enum: [exact, contains, regex]
    RawMessageStatus:
      type: string
      enum: [imported, duplicate, ignored, redacted]
    ParsedMessageCandidateStatus:
      type: string
      enum: [needs_review, confirmed, ignored]
    ParsedMessageRejectionReason:
      type: string
      enum: [not_transaction, otp_security, duplicate, wrong_provider_account, personal, unsupported_format, other]
    BalanceSnapshotStatus:
      type: string
      enum: [matched, missing_money, extra_money, adjusted, ignored]
    DebtDirection:
      type: string
      enum: [lent_by_me, borrowed_by_me]
    DebtStatus:
      type: string
      enum: [open, partially_paid, paid, written_off]
    CreditCardBillStatus:
      type: string
      enum: [unpaid, partially_paid, paid, waived]
    RecurringBillFrequency:
      type: string
      enum: [weekly, monthly, quarterly, yearly]
    RecurringBillStatus:
      type: string
      enum: [active, paused, ended]
    ParsedMessageKind:
      type: string
      enum:
        - purchase
        - cash_in
        - cash_out
        - send_money
        - receive_money
        - bank_transfer_in
        - bank_transfer_out
        - card_purchase
        - card_payment
        - fee
        - refund
        - reversal
        - balance_notice
        - otp_or_security
        - promotional
        - unknown
    AuditLogEntry:
      type: object
      required: [id, action, entity_type, entity_id, before, after, metadata, created_at]
      properties:
        id:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/AuditLogAction'
        entity_type:
          type: string
          example: transactions.transaction
        entity_id:
          type: string
          example: 11111111-1111-1111-1111-111111111111
        before:
          type: object
          additionalProperties: true
          nullable: true
          description: Snapshot before the change; null for creates.
        after:
          type: object
          additionalProperties: true
          nullable: true
          description: Snapshot after the change; null for deletes.
        metadata:
          type: object
          additionalProperties: true
          description: Non-sensitive audit metadata, including recorded timestamp.
        created_at:
          type: string
          format: date-time
    Account:
      type: object
      required:
        [id, name, type, currency, starting_balance, ledger_balance, latest_reported_balance, latest_reported_balance_date, is_active, display_order, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          type: string
          maxLength: 3
          default: BDT
        starting_balance:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          example: "0.00"
        ledger_balance:
          type: string
          description: Balance derived from the opening balance and all posted ledger transactions.
          example: "1250.00"
          readOnly: true
        latest_reported_balance:
          type: string
          nullable: true
          description: Most recent provider-reported balance captured after a transaction, when available.
          example: "1245.50"
          readOnly: true
        latest_reported_balance_date:
          type: string
          format: date
          nullable: true
          description: Transaction date associated with the latest provider-reported balance.
          readOnly: true
        is_active:
          type: boolean
        display_order:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AccountCreateRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          maxLength: 120
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          type: string
          maxLength: 3
          default: BDT
        starting_balance:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          example: "0.00"
        is_active:
          type: boolean
          default: true
        display_order:
          type: integer
          minimum: 0
          default: 0
    AccountPatchRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          type: string
          maxLength: 3
        starting_balance:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
        is_active:
          type: boolean
        display_order:
          type: integer
          minimum: 0
    PaymentMethod:
      type: object
      required:
        [id, account, name, provider, identifier, is_active, display_order, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        account:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        provider:
          $ref: '#/components/schemas/PaymentProvider'
        identifier:
          type: string
          maxLength: 120
          description: Optional masked phone, card suffix, bank nickname, or other user-safe identifier.
        is_active:
          type: boolean
        display_order:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PaymentMethodCreateRequest:
      type: object
      required: [account, name, provider]
      properties:
        account:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        provider:
          $ref: '#/components/schemas/PaymentProvider'
        identifier:
          type: string
          maxLength: 120
          default: ""
        is_active:
          type: boolean
          default: true
        display_order:
          type: integer
          minimum: 0
          default: 0
    PaymentMethodPatchRequest:
      type: object
      properties:
        account:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        provider:
          $ref: '#/components/schemas/PaymentProvider'
        identifier:
          type: string
          maxLength: 120
        is_active:
          type: boolean
        display_order:
          type: integer
          minimum: 0
    SenderRule:
      type: object
      required:
        [id, account, payment_method, category, name, provider, sender, match_type, pattern, default_transaction_type, priority, is_active, notes, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        account:
          type: string
          format: uuid
        payment_method:
          type: string
          format: uuid
          nullable: true
        category:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          maxLength: 120
        provider:
          $ref: '#/components/schemas/SenderRuleProvider'
        sender:
          type: string
          maxLength: 120
          description: Must match one of the authenticated user's active sender rules.
          description: Must be unique per authenticated user and match type, compared case-insensitively.
        match_type:
          $ref: '#/components/schemas/SenderRuleMatchType'
        pattern:
          type: string
          maxLength: 255
          description: Optional matching pattern, especially for contains or regex rules.
        default_transaction_type:
          oneOf:
            - $ref: '#/components/schemas/TransactionType'
            - type: string
              enum: ['']
        priority:
          type: integer
          minimum: 0
        is_active:
          type: boolean
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SenderRuleCreateRequest:
      type: object
      required: [account, name, provider, sender]
      properties:
        account:
          type: string
          format: uuid
        payment_method:
          type: string
          format: uuid
          nullable: true
        category:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          maxLength: 120
        provider:
          $ref: '#/components/schemas/SenderRuleProvider'
        sender:
          type: string
          maxLength: 120
          description: Must be unique per authenticated user and match type, compared case-insensitively.
        match_type:
          $ref: '#/components/schemas/SenderRuleMatchType'
        pattern:
          type: string
          maxLength: 255
          default: ""
        default_transaction_type:
          oneOf:
            - $ref: '#/components/schemas/TransactionType'
            - type: string
              enum: ['']
          default: ""
        priority:
          type: integer
          minimum: 0
          default: 100
        is_active:
          type: boolean
          default: true
        notes:
          type: string
          default: ""
    SenderRulePatchRequest:
      type: object
      properties:
        account:
          type: string
          format: uuid
        payment_method:
          type: string
          format: uuid
          nullable: true
        category:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          maxLength: 120
        provider:
          $ref: '#/components/schemas/SenderRuleProvider'
        sender:
          type: string
          maxLength: 120
        match_type:
          $ref: '#/components/schemas/SenderRuleMatchType'
        pattern:
          type: string
          maxLength: 255
        default_transaction_type:
          oneOf:
            - $ref: '#/components/schemas/TransactionType'
            - type: string
              enum: ['']
        priority:
          type: integer
          minimum: 0
        is_active:
          type: boolean
        notes:
          type: string
    RawMessage:
      type: object
      required:
        [id, sender, body, received_at, device_message_id, body_hash, provider, message_kind, exclusion_reason, status, duplicate_of, created_at, redacted_at]
      properties:
        id:
          type: string
          format: uuid
        sender:
          type: string
          maxLength: 120
        body:
          type: string
        received_at:
          type: string
          format: date-time
        device_message_id:
          type: string
          maxLength: 120
          description: Optional Android/device SMS row ID when available.
        body_hash:
          type: string
          maxLength: 64
          readOnly: true
        provider:
          type: string
          description: Provider resolved from the matching sender rule.
        message_kind:
          type: string
          description: Message kind resolved before storage when possible.
        exclusion_reason:
          type: string
          description: Why the raw body was excluded or the candidate was rejected.
        status:
          $ref: '#/components/schemas/RawMessageStatus'
        duplicate_of:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        redacted_at:
          type: string
          format: date-time
          nullable: true
    RawMessageImportRequest:
      type: object
      required: [sender, body, received_at]
      properties:
        sender:
          type: string
          maxLength: 120
        body:
          type: string
        received_at:
          type: string
          format: date-time
        device_message_id:
          type: string
          maxLength: 120
          default: ""
        reprocess_existing:
          type: boolean
          default: false
          description: Re-run a duplicate pending review candidate through the latest parser.
    RawMessageImportResponse:
      type: object
      required: [candidate, is_duplicate, was_reprocessed, message]
      properties:
        candidate:
          allOf:
            - $ref: '#/components/schemas/ParsedMessageCandidate'
          nullable: true
        is_duplicate:
          type: boolean
        was_reprocessed:
          type: boolean
          description: True when an existing pending candidate was updated by the latest parser.
        message:
          $ref: '#/components/schemas/RawMessage'
    RawMessageRedactResponse:
      type: object
      required: [candidate, message]
      properties:
        candidate:
          allOf:
            - $ref: '#/components/schemas/ParsedMessageCandidate'
          nullable: true
        message:
          $ref: '#/components/schemas/RawMessage'
    ParsedMessageCandidate:
      type: object
      required:
        [id, raw_message, sender_rule, account, payment_method, category, destination_account, destination_payment_method, transaction, possible_related_candidate, provider, message_kind, transaction_type, amount, sender_account_identifier, sender_card_identifier, receiver_account_identifier, receiver_card_identifier, counterparty_text, reference, balance_after, fee_amount, possible_internal_transfer, related_match_reason, confidence, status, parser_name, parser_notes, rejection_reason, rejection_note, rejected_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        raw_message:
          $ref: '#/components/schemas/RawMessage'
        sender_rule:
          type: string
          format: uuid
          nullable: true
        account:
          type: string
          format: uuid
          nullable: true
        payment_method:
          type: string
          format: uuid
          nullable: true
        category:
          type: string
          format: uuid
          nullable: true
        destination_account:
          type: string
          format: uuid
          nullable: true
          description: Destination account hint for transfer-aware review.
        destination_payment_method:
          type: string
          format: uuid
          nullable: true
          description: Destination payment method hint for transfer-aware review.
        transaction:
          type: string
          format: uuid
          nullable: true
        possible_related_candidate:
          type: string
          format: uuid
          nullable: true
          description: Candidate that may represent the other side of the same internal transfer.
        provider:
          $ref: '#/components/schemas/SenderRuleProvider'
        message_kind:
          $ref: '#/components/schemas/ParsedMessageKind'
        transaction_type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          type: string
          nullable: true
          pattern: '^\d+(\.\d{1,2})?$'
          example: "500.00"
        sender_account_identifier:
          type: string
          maxLength: 120
          description: Masked account evidence for the sending side; never a full account number.
        sender_card_identifier:
          type: string
          maxLength: 120
          description: Masked card evidence for the sending side; never a full PAN.
        receiver_account_identifier:
          type: string
          maxLength: 120
          description: Masked account evidence for the receiving side.
        receiver_card_identifier:
          type: string
          maxLength: 120
          description: Masked card evidence for the receiving side; never a full PAN.
        counterparty_text:
          type: string
          maxLength: 255
        reference:
          type: string
          maxLength: 120
        balance_after:
          type: string
          nullable: true
          pattern: '^-?\d+(\.\d{1,2})?$'
          example: "1500.00"
        fee_amount:
          type: string
          nullable: true
          pattern: '^\d+(\.\d{1,2})?$'
          example: "0.00"
        possible_internal_transfer:
          type: boolean
        related_match_reason:
          type: string
          maxLength: 255
        confidence:
          type: string
          example: "0.70"
        status:
          $ref: '#/components/schemas/ParsedMessageCandidateStatus'
        parser_name:
          type: string
        suggested_transfer_direction:
          type: string
          enum: ['', debit, credit]
          description: Optional suggested direction for the reporting account; blank when no transfer path is suggested.
        transfer_suggestion_reason:
          type: string
          description: Explanation for a suggested transfer path or ambiguity. Suggestions require review and never post ledger activity.
        parser_notes:
          type: string
        rejection_reason:
          type: string
          description: Empty until the candidate is rejected.
        rejection_note:
          type: string
        rejected_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ParsedMessageConfirmRequest:
      type: object
      properties:
        account_perspective:
          type: boolean
          default: false
          description: When true, account is the observed account, direction is its debit/credit side, and transfer_account is the other account. Credit transfers are normalized to other account as source. Omit or use false for legacy canonical source/destination corrections.
        account:
          type: string
          format: uuid
          description: Required if the candidate did not match an account.
        transfer_account:
          type: string
          format: uuid
          nullable: true
          description: Required when confirming a candidate as a transfer; the other account when account_perspective is true, otherwise the canonical destination.
        amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          description: Required if the baseline parser did not extract an amount.
        balance_after:
          type: string
          nullable: true
          pattern: '^-?\d+(\.\d{1,2})?$'
        category:
          type: string
          format: uuid
          nullable: true
        payment_method:
          type: string
          format: uuid
          nullable: true
        date:
          type: string
          format: date
        time:
          type: string
          format: time
          nullable: true
        direction:
          $ref: '#/components/schemas/TransactionDirection'
        reference:
          type: string
          description: Optional provider or user reference; may repeat and is not the internal transaction UUID.
        counterparty_text:
          type: string
        sender_account_identifier:
          type: string
          maxLength: 120
        sender_card_identifier:
          type: string
          maxLength: 120
        receiver_account_identifier:
          type: string
          maxLength: 120
        receiver_card_identifier:
          type: string
          maxLength: 120
        note:
          type: string
        type:
          $ref: '#/components/schemas/TransactionType'
        remember_mapping:
          type: boolean
          default: false
          description: Learn choices for this sender and parsed message kind, then apply them to matching pending candidates.
    MessageCandidateBulkReprocessResponse:
      type: object
      required: [requested, reprocessed, remaining_for_review]
      properties:
        requested:
          type: integer
          minimum: 0
        reprocessed:
          type: integer
          minimum: 0
        remaining_for_review:
          type: integer
          minimum: 0
    ParsedMessageRejectRequest:
      type: object
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/ParsedMessageRejectionReason'
        note:
          type: string
          maxLength: 255
          default: ""
        redact_raw_sms:
