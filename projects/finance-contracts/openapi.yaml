components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UuidPathId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    UnauthorizedError:
      description: Authentication credentials were not provided or are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
    NotFoundError:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorObject'
              - type: object
                additionalProperties:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ErrorObject:
      type: object
      properties:
        detail:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string
    TokenPair:
      type: object
      required: [access, refresh]
      properties:
        access:
          type: string
        refresh:
          type: string
    User:
      type: object
      required: [id, username, email, first_name, last_name]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
    AccountType:
      type: string
      enum: [cash, home_cash, mobile_wallet, bank, credit_card, savings, other]
    CategoryKind:
      type: string
      enum: [expense, income, transfer, debt, system]
    TransactionType:
      type: string
      enum:
        - expense
        - income
        - transfer
        - adjustment
        - fee
        - refund
        - lend
        - borrow
        - repayment_received
        - repayment_paid
    TransactionSource:
      type: string
      enum: [web, mobile, sms, import, system]
    TransactionDirection:
      type: string
      enum: [debit, credit]
    AuditLogAction:
      type: string
      enum: [created, updated, deleted]
    PaymentProvider:
      type: string
      enum: [cash, bkash, nagad, rocket, ebl, city_bank, pathao_pay, bank, card, manual, other]
    SenderRuleProvider:
      type: string
      enum: [bkash, nagad, rocket, ebl, city_bank, pathao_pay, bank, card, other]
    SenderRuleMatchType:
      type: string
      enum: [exact, contains, regex]
    RawMessageStatus:
      type: string
      enum: [imported, duplicate, ignored, redacted]
    ParsedMessageCandidateStatus:
      type: string
      enum: [needs_review, confirmed, ignored]
    ParsedMessageRejectionReason:
      type: string
      enum: [not_transaction, otp_security, duplicate, wrong_provider_account, personal, unsupported_format, other]
    BalanceSnapshotStatus:
      type: string
      enum: [matched, missing_money, extra_money, adjusted, ignored]
    DebtDirection:
      type: string
      enum: [lent_by_me, borrowed_by_me]
    DebtStatus:
      type: string
      enum: [open, partially_paid, paid, written_off]
    CreditCardBillStatus:
      type: string
      enum: [unpaid, partially_paid, paid, waived]
    RecurringBillFrequency:
      type: string
      enum: [weekly, monthly, quarterly, yearly]
    RecurringBillStatus:
      type: string
      enum: [active, paused, ended]
    ParsedMessageKind:
      type: string
      enum:
        - purchase
        - cash_in
        - cash_out
        - send_money
        - receive_money
        - bank_transfer_in
        - bank_transfer_out
        - card_purchase
        - card_payment
        - fee
        - refund
        - reversal
        - balance_notice
        - otp_or_security
        - unknown
    AuditLogEntry:
      type: object
      required: [id, action, entity_type, entity_id, before, after, metadata, created_at]
      properties:
        id:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/AuditLogAction'
        entity_type:
          type: string
          example: transactions.transaction
        entity_id:
          type: string
          example: 11111111-1111-1111-1111-111111111111
        before:
          type: object
          additionalProperties: true
          nullable: true
          description: Snapshot before the change; null for creates.
        after:
          type: object
          additionalProperties: true
          nullable: true
          description: Snapshot after the change; null for deletes.
        metadata:
          type: object
          additionalProperties: true
          description: Non-sensitive audit metadata, including recorded timestamp.
        created_at:
          type: string
          format: date-time
    Account:
      type: object
      required:
        [id, name, type, currency, starting_balance, ledger_balance, latest_reported_balance, latest_reported_balance_date, is_active, display_order, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          type: string
          maxLength: 3
          default: BDT
        starting_balance:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          example: "0.00"
        ledger_balance:
          type: string
          description: Balance derived from the opening balance and all posted ledger transactions.
          example: "1250.00"
          readOnly: true
        latest_reported_balance:
          type: string
          nullable: true
          description: Most recent provider-reported balance captured after a transaction, when available.
          example: "1245.50"
          readOnly: true
        latest_reported_balance_date:
          type: string
          format: date
          nullable: true
          description: Transaction date associated with the latest provider-reported balance.
          readOnly: true
        is_active:
          type: boolean
        display_order:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AccountCreateRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          maxLength: 120
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          type: string
          maxLength: 3
          default: BDT
        starting_balance:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          example: "0.00"
        is_active:
          type: boolean
          default: true
        display_order:
          type: integer
          minimum: 0
          default: 0
    AccountPatchRequest:
      type: object
      properties:
        name:
          type: string
